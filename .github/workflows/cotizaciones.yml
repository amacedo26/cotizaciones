name: Cotizaciones

# Actualiza el tablero de oro, dólar internacional y BEVSA.
# GitHub deshabilita los cron de un repo sin actividad por 60 días: si el
# tablero deja de actualizarse sin motivo, revisar eso primero.
on:
  schedule:
    - cron: '0 * * * *'   # cada hora, en UTC
  workflow_dispatch:         # botón para correrlo a mano desde la pestaña Actions
    inputs:
      modo:
        description: 'actualizar = corrida normal; sondeo = diagnóstico de fuentes, no escribe nada'
        type: choice
        options: [actualizar, sondeo, candidatos]
        default: actualizar

permissions:
  contents: write

concurrency:
  group: cotizaciones
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probar el parser
        run: node --test scripts/probar-parseo.mjs

      - name: Revisar las fuentes en producción
        if: inputs.modo == 'sondeo'
        run: node scripts/sondeo.mjs

      - name: Explorar fuentes nuevas
        if: inputs.modo == 'candidatos'
        run: node scripts/candidatos.mjs

      - name: Consultar fuentes
        if: inputs.modo == 'actualizar' || inputs.modo == ''
        run: node scripts/actualizar.mjs

      - name: Commitear si algo cambió
        if: inputs.modo == 'actualizar' || inputs.modo == ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .   # raw-bevsa.json puede no existir si la fuente falló
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "chore(cotizaciones): datos $(date -u +'%Y-%m-%d %H:%M UTC')"
          # el repo puede haber avanzado mientras corría el job
          for intento in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push falló, reintento $intento"
            sleep $((2 ** intento))
          done
          exit 1
