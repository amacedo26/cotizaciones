# Corrida manual: sirve para mirar las fuentes desde una IP con salida a
# internet. No toca datos ni despliega nada; solo imprime lo que responden.
#
# Es lo único que quedó en Actions. El tablero corre en Netlify: ver el README.
name: Explorar fuentes

on:
  workflow_dispatch:
    inputs:
      script:
        description: "sondeo = fuentes en producción · candidatos = fuentes a evaluar · ver-foto = la corrida entera, de punta a punta"
        type: choice
        default: sondeo
        options: [sondeo, candidatos, ver-foto]

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/${{ inputs.script }}.mjs
